<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube World .cub Canvas Editor</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        h2 { margin: 5px 0; font-size: 18px; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
        button, label.btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover, label.btn:hover { background: #444; }
        input[type="file"] { display: none; }
        #canvasContainer { width: 360px; height: 360px; border: 1px solid #444; background: #1e1e1e; position: relative; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        .info { margin: 5px 0; font-size: 13px; color: #aaa; text-align: center; }
    </style>
</head>
<body>

    <h2>Cube World .cub Editor (Canvas)</h2>
    
    <div class="toolbar">
        <label class="btn">
            Megnyitás <input type="file" id="fileInput" accept=".cub">
        </label>
        <button id="viewBtn">Nézet: 3D Izometrikus</button>
        <button id="saveBtn">Mentés</button>
    </div>

    <div class="info" id="infoText">Nyiss meg egy .cub fájlt!</div>

    <div id="canvasContainer">
        <canvas id="editorCanvas" width="360" height="360"></canvas>
    </div>

    <div class="toolbar" id="sliceControls" style="display: none;">
        <button id="prevLayer">&larr; Előző réteg</button>
        <span id="layerInfo" style="line-height: 30px;">Z: 1/1</span>
        <button id="nextLayer">Következő réteg &rarr;</button>
    </div>

    <script>
        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const infoText = document.getElementById('infoText');
        const viewBtn = document.getElementById('viewBtn');
        const sliceControls = document.getElementById('sliceControls');
        const layerInfo = document.getElementById('layerInfo');

        let model = {
            sizeX: 0,
            sizeY: 0,
            sizeZ: 0,
            buffer: null,
            dataOffset: 12
        };

        let is3DView = true;
        let currentZ = 0;

        viewBtn.addEventListener('click', () => {
            is3DView = !is3DView;
            viewBtn.innerText = is3DView ? 'Nézet: 3D Izometrikus' : 'Nézet: 2D Szelet';
            sliceControls.style.display = is3DView ? 'none' : 'flex';
            render();
        });

        document.getElementById('prevLayer').addEventListener('click', () => {
            if (currentZ > 0) { currentZ--; render(); }
        });

        document.getElementById('nextLayer').addEventListener('click', () => {
            if (currentZ < model.sizeZ - 1) { currentZ++; render(); }
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const buffer = evt.target.result;
                const view = new DataView(buffer);

                if (buffer.byteLength < 12) {
                    alert('Hibás fájlméret!');
                    return;
                }

                model.sizeX = view.getUint32(0, true);
                model.sizeY = view.getUint32(4, true);
                model.sizeZ = view.getUint32(8, true);
                model.buffer = buffer;
                model.dataOffset = 12;
                currentZ = 0;

                infoText.innerText = `Betöltve: ${file.name} (${model.sizeX}x${model.sizeY}x${model.sizeZ})`;
                render();
            };
            reader.readAsArrayBuffer(file);
        });

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!model.buffer) return;

            if (is3DView) {
                renderIsometric();
            } else {
                renderSlice(currentZ);
            }
        }

        // Saját izometrikus kirajzolás a helyes színekkel (RGB)
        function renderIsometric() {
            const { sizeX, sizeY, sizeZ, buffer, dataOffset } = model;
            const view = new DataView(buffer);

            let offset = dataOffset;
            const voxels = [];

            for (let z = 0; z < sizeZ; z++) {
                for (let y = 0; y < sizeY; y++) {
                    for (let x = 0; x < sizeX; x++) {
                        if (offset + 4 > buffer.byteLength) break;
                        const r = view.getUint8(offset);
                        const g = view.getUint8(offset + 1);
                        const b = view.getUint8(offset + 2);
                        const a = view.getUint8(offset + 3);
                        offset += 4;

                        if (a > 0) {
                            voxels.push({ x, y, z, r, g, b });
                        }
                    }
                }
            }

            // Egyszerű izometrikus kivetítés képernyőre
            const scale = Math.min(canvas.width / (sizeX + sizeY + 4), canvas.height / (sizeZ + sizeX + 4)) * 1.5;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + sizeZ * scale * 0.3;

            // Visszafelé rajzolás (Painter's algorithm a helyes takarásért)
            voxels.sort((v1, v2) => (v1.x + v1.y + v1.z) - (v2.x + v2.y + v2.z));

            voxels.forEach(v => {
                const isoX = centerX + (v.x - v.y) * (scale * 0.7);
                const isoY = centerY + (v.x + v.y) * (scale * 0.35) - (v.z * scale * 0.7);

                ctx.fillStyle = `rgb(${v.r}, ${v.g}, ${v.b})`;
                ctx.fillRect(isoX, isoY, scale * 0.7, scale * 0.7);
            });
        }

        // 2D szelet nézet szerkesztéshez
        function renderSlice(z) {
            const { sizeX, sizeY, buffer, dataOffset } = model;
            const view = new DataView(buffer);

            const cellSize = Math.min(canvas.width / sizeX, canvas.height / sizeY) * 0.8;
            const offsetX = (canvas.width - sizeX * cellSize) / 2;
            const offsetY = (canvas.height - sizeY * cellSize) / 2;

            layerInfo.innerText = `Z réteg: ${z + 1} / ${model.sizeZ}`;

            for (let y = 0; y < sizeY; y++) {
                for (let x = 0; x < sizeX; x++) {
                    // Kiszámoljuk az adott voxel pozícióját a bufferben
                    const index = (z * sizeY * sizeX) + (y * sizeX) + x;
                    const bytePos = dataOffset + index * 4;

                    if (bytePos + 4 > buffer.byteLength) continue;

                    const r = view.getUint8(bytePos);
                    const g = view.getUint8(bytePos + 1);
                    const b = view.getUint8(bytePos + 2);
                    const a = view.getUint8(bytePos + 3);

                    if (a > 0) {
                        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    } else {
                        ctx.fillStyle = '#222';
                    }

                    ctx.fillRect(offsetX + x * cellSize, offsetY + y * cellSize, cellSize - 1, cellSize - 1);
                }
            }
        }

        document.getElementById('saveBtn').addEventListener('click', () => {
            if (!model.buffer) {
                alert('Nincs betöltött modell!');
                return;
            }
            const blob = new Blob([model.buffer], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'edited_model.cub';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>

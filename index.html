<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube World .cub Editor (3D)</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        h2 { margin: 5px 0; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
        button, label.btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover, label.btn:hover { background: #444; }
        input[type="file"] { display: none; }
        #canvas-container { width: 320px; height: 320px; border: 1px solid #444; background: #1e1e1e; position: relative; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        .layer-info { margin: 5px 0; font-size: 14px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <h2>Cube World .cub Editor (3D)</h2>
    
    <div class="toolbar">
        <label class="btn">
            Fájl Megnyitás <input type="file" id="fileInput" accept=".cub">
        </label>
        <button id="saveBtn">Mentés (.cub)</button>
    </div>

    <div class="layer-info" id="layerInfo">Modell betöltésre vár...</div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e1e1e);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(25, 25, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enableZoom = false;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        let voxelGroup = new THREE.Group();
        scene.add(voxelGroup);

        // ** JAVÍTVA: Helyes geometria definíció **
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);

        function parseCubeWorld(buffer) {
            const dataView = new DataView(buffer);
            let offset = 0;

            try {
                while (offset < buffer.byteLength) {
                    if (offset + 6 > buffer.byteLength) break;
                    
                    const x = dataView.getUint8(offset++);
                    const y = dataView.getUint8(offset++);
                    const z = dataView.getUint8(offset++);
                    const r = dataView.getUint8(offset++);
                    const g = dataView.getUint8(offset++);
                    const b = dataView.getUint8(offset++);
                    
                    const mat = new THREE.MeshLambertMaterial({ color: (r << 16) | (g << 8) | b });
                    const mesh = new THREE.Mesh(boxGeo, mat);
                    mesh.position.set(x - 8, z - 8, y - 8);
                    voxelGroup.add(mesh);
                }
            } catch (err) {
                console.error("Hiba a fájl feldolgozása közben:", err);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                while(voxelGroup.children.length > 0) {
                    voxelGroup.remove(voxelGroup.children[0]);
                }
                
                parseCubeWorld(evt.target.result);
                document.getElementById('layerInfo').innerText = `Betöltve: ${file.name} (${voxelGroup.children.length} voxel)`;
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            alert('Mentési funkció előkészítés alatt.');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube World .cub Editor</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        h2 { margin: 5px 0; font-size: 18px; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
        button, label.btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover, label.btn:hover { background: #444; }
        input[type="file"] { display: none; }
        #canvas-container { width: 100%; max-width: 360px; height: 360px; border: 1px solid #444; background: #1e1e1e; position: relative; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        .info { margin: 5px 0; font-size: 13px; color: #aaa; text-align: center; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <h2>Cube World .cub Editor</h2>
    
    <div class="toolbar">
        <label class="btn">
            Megnyitás <input type="file" id="fileInput" accept=".cub">
        </label>
        <button id="modeBtn">Mód: Forgatás</button>
        <button id="saveBtn">Mentés</button>
    </div>

    <div class="info" id="layerInfo">Nyiss meg egy .cub fájlt!</div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e1e1e);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(40, 40, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enableZoom = false;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 40, 30);
        scene.add(dirLight);

        let voxelGroup = new THREE.Group();
        scene.add(voxelGroup);

        let currentModel = {
            sizeX: 0, sizeY: 0, sizeZ: 0,
            buffer: null,
            dataOffset: 0
        };

        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        let editMode = false;

        const modeBtn = document.getElementById('modeBtn');
        modeBtn.addEventListener('click', () => {
            editMode = !editMode;
            controls.enabled = !editMode;
            modeBtn.style.background = editMode ? '#4CAF50' : '#333';
            modeBtn.innerText = editMode ? 'Mód: Szerkesztés' : 'Mód: Forgatás';
        });

        function renderVoxels() {
            while(voxelGroup.children.length > 0) {
                voxelGroup.remove(voxelGroup.children[0]);
            }

            if (!currentModel.buffer) return;

            const { sizeX, sizeY, sizeZ, buffer, dataOffset } = currentModel;
            const view = new DataView(buffer);
            
            const offsetX = sizeX / 2;
            const offsetY = sizeY / 2;
            const offsetZ = sizeZ / 2;

            let offset = dataOffset;
            let voxelCount = 0;

            // Cube World .cub struktúra: X, Y, Z iteráció vagy RGBA adatok
            for (let z = 0; z < sizeZ; z++) {
                for (let y = 0; y < sizeY; y++) {
                    for (let x = 0; x < sizeX; x++) {
                        if (offset + 4 > buffer.byteLength) break;

                        // Cube World színek általában BGRA vagy RGBA formátumúak
                        const r = view.getUint8(offset);
                        const g = view.getUint8(offset + 1);
                        const b = view.getUint8(offset + 2);
                        const a = view.getUint8(offset + 3);
                        offset += 4;

                        // Ha nem üres (az alpha nem 0)
                        if (a > 0 || (r > 0 || g > 0 || b > 0)) {
                            // Bizonyos fájloknál az alpha 0 is lehet, ha van szín, de itt szűrünk
                            const mat = new THREE.MeshLambertMaterial({ color: (r << 16) | (g << 8) | b });
                            const mesh = new THREE.Mesh(boxGeo, mat);
                            
                            // Pontosabb középre igazítás a modell méretei alapján (pl. fegyvereknél mint a bow.cub)
                            mesh.position.set(x - offsetX + 0.5, z - offsetZ + 0.5, y - offsetY + 0.5);
                            mesh.userData = { offset: offset - 4 };
                            voxelGroup.add(mesh);
                            voxelCount++;
                        }
                    }
                }
            }
            document.getElementById('layerInfo').innerText = `Méret: ${sizeX}x${sizeY}x${sizeZ} | Voxelek: ${voxelCount}`;
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                const buffer = evt.target.result;
                const view = new DataView(buffer);

                if (buffer.byteLength < 12) {
                    alert('Hibás fájlméret!');
                    return;
                }

                currentModel.sizeX = view.getUint32(0, true);
                currentModel.sizeY = view.getUint32(4, true);
                currentModel.sizeZ = view.getUint32(8, true);
                currentModel.buffer = buffer;
                currentModel.dataOffset = 12;

                renderVoxels();
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            if (!currentModel.buffer) {
                alert('Nincs betöltött modell!');
                return;
            }
            const blob = new Blob([currentModel.buffer], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'edited_bow.cub';
            a.click();
            URL.revokeObjectURL(url);
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (e) => {
            if (!editMode || !currentModel.buffer) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(voxelGroup.children);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const dataOffset = hit.object.userData.offset;
                
                // Alpha vagy szín nullázása (törlés)
                const view = new DataView(currentModel.buffer);
                view.setUint8(dataOffset + 3, 0); // Alpha = 0
                renderVoxels();
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>

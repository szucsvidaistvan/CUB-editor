<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube World .cub Editor - 3D</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        h2 { margin: 5px 0; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
        button, label.btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover, label.btn:hover { background: #444; }
        input[type="file"] { display: none; }
        #canvas-container { width: 320px; height: 320px; border: 1px solid #444; background: #1e1e1e; position: relative; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        .layer-info { margin: 5px 0; font-size: 14px; }
    </style>
    <!-- Three.js és OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <h2>Cube World .cub Editor (3D)</h2>
    
    <div class="toolbar">
        <label class="btn">
            Fájl Megnyitás <input type="file" id="fileInput" accept=".cub">
        </label>
        <button id="saveBtn">Mentés (.cub)</button>
    </div>

    <div class="layer-info" id="layerInfo">3D Forgatható Modell (Zoom tiltva)</div>

    <div id="canvas-container"></div>

    <script>
        const SIZE = 16;
        let voxels = new Uint8Array(SIZE * SIZE * SIZE);

        // Three.js alapok
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e1e1e);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(25, 25, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enableZoom = false; // <-- Itt tiltottuk le a zoomolást

        // Világítás
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 15);
        scene.add(directionalLight);

        // Voxelháló csoport tárolására
        let voxelGroup = new THREE.Group();
        scene.add(voxelGroup);

        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const boxMat = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });

        function update3DScene() {
            // Előző kockák törlése
            while(voxelGroup.children.length > 0){ 
                voxelGroup.remove(voxelGroup.children[0]); 
            }

            const offset = SIZE / 2;

            for (let z = 0; z < SIZE; z++) {
                for (let y = 0; y < SIZE; y++) {
                    for (let x = 0; x < SIZE; x++) {
                        const index = x + y * SIZE + z * SIZE * SIZE;
                        if (voxels[index] > 0) {
                            const mesh = new THREE.Mesh(boxGeo, boxMat);
                            mesh.position.set(x - offset + 0.5, z - offset + 0.5, y - offset + 0.5);
                            voxelGroup.add(mesh);
                        }
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Fájl betöltés
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const buffer = new Uint8Array(evt.target.result);
                const len = Math.min(buffer.length, voxels.length);
                voxels.set(buffer.subarray(0, len));
                update3DScene();
            };
            reader.readAsArrayBuffer(file);
        });

        // Fájl mentés
        document.getElementById('saveBtn').addEventListener('click', () => {
            const blob = new Blob([voxels], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'model_edited.cub';
            a.click();
            URL.revokeObjectURL(url);
        });

        // Kezdeti üres generálás
        update3DScene();
    </script>
</body>
</html>
